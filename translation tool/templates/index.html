<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Language Translator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .language-section {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .language-box {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
            background: white;
        }

        .text-section {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .text-box {
            flex: 1;
        }

        textarea {
            width: 100%;
            height: 220px;
            resize: none;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        textarea:focus,
        select:focus {
            border-color: #667eea;
        }

        .button-container {
            text-align: center;
            margin: 20px 0;
        }

        button {
            border: none;
            padding: 13px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .translate-btn {
            background: #667eea;
            color: white;
        }

        .translate-btn:hover {
            background: #5568d8;
            transform: translateY(-2px);
        }

        .copy-btn {
            background: #eee;
            color: #333;
            margin-top: 10px;
        }

        .copy-btn:hover {
            background: #ddd;
        }

        #status {
            text-align: center;
            margin-top: 10px;
            color: #666;
        }

        @media (max-width: 700px) {
            .language-section,
            .text-section {
                flex-direction: column;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌍 AI Language Translator</h1>

    <p class="subtitle">
        Translate text between multiple languages instantly
    </p>

    <div class="language-section">

        <div class="language-box">
            <label for="sourceLanguage">Source Language</label>

            <select id="sourceLanguage">
                <option value="auto">Auto Detect</option>
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="kn">Kannada</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="es">Spanish</option>
                <option value="it">Italian</option>
                <option value="ja">Japanese</option>
                <option value="ko">Korean</option>
                <option value="zh-CN">Chinese</option>
                <option value="ar">Arabic</option>
                <option value="ru">Russian</option>
            </select>
        </div>


        <div class="language-box">
            <label for="targetLanguage">Target Language</label>

            <select id="targetLanguage">
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="kn">Kannada</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="es">Spanish</option>
                <option value="it">Italian</option>
                <option value="ja">Japanese</option>
                <option value="ko">Korean</option>
                <option value="zh-CN">Chinese</option>
                <option value="ar">Arabic</option>
                <option value="ru">Russian</option>
            </select>
        </div>

    </div>


    <div class="text-section">

        <div class="text-box">

            <label for="inputText">Enter Text</label>

            <textarea
                id="inputText"
                placeholder="Type or paste your text here..."
            ></textarea>

        </div>


        <div class="text-box">

            <label for="outputText">Translated Text</label>

            <textarea
                id="outputText"
                placeholder="Translation will appear here..."
                readonly
            ></textarea>

            <button class="copy-btn" onclick="copyTranslation()">
                📋 Copy Translation
            </button>

        </div>

    </div>


    <div class="button-container">

        <button class="translate-btn" onclick="translateText()">
            🌐 Translate
        </button>

    </div>


    <p id="status"></p>

</div>


<script>

async function translateText() {

    const text = document.getElementById("inputText").value;

    const source =
        document.getElementById("sourceLanguage").value;

    const target =
        document.getElementById("targetLanguage").value;

    const output =
        document.getElementById("outputText");

    const status =
        document.getElementById("status");


    if (!text.trim()) {

        status.textContent =
            "Please enter some text first.";

        output.value = "";

        return;
    }


    status.textContent = "Translating...";


    try {

        const response = await fetch("/translate", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                text: text,

                source: source,

                target: target

            })

        });


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.error || "Translation failed."
            );

        }


        output.value = data.translation;

        status.textContent =
            "Translation completed successfully.";

    }

    catch (error) {

        output.value = "";

        status.textContent =
            "Error: " + error.message;

    }

}


function copyTranslation() {

    const output =
        document.getElementById("outputText");

    if (!output.value) {
        return;
    }

    navigator.clipboard.writeText(output.value);

    document.getElementById("status").textContent =
        "Translation copied to clipboard!";

}

</script>

</body>
</html>
